<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEXES - PRIVATE ACCESS</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📼</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #890808;
            --crt-overlay: rgba(18, 16, 16, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .noise {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.08;
            z-index: 9;
            pointer-events: none;
            animation: static-noise 0.2s steps(3) infinite, background-glitch 12s infinite;
        }

        @keyframes static-noise {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2%, 2%); }
            40% { transform: translate(2%, -2%); }
            60% { transform: translate(-2%, -2%); }
            80% { transform: translate(2%, 2%); }
            100% { transform: translate(0, 0); }
        }

        @keyframes background-glitch {
            0%, 94%, 100% { filter: none; opacity: 0.08; }
            95% { filter: invert(1) contrast(300%); opacity: 0.15; }
            95.5% { filter: none; opacity: 0.08; }
            98% { filter: sepia(1) hue-rotate(90deg) saturate(300%); opacity: 0.12; }
            98.5% { filter: none; opacity: 0.08; }
        }

        /* --- Pantalla de Login --- */
        #login-screen {
            text-align: center;
            z-index: 20;
        }

        .terminal-prompt {
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        input[type="password"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-color);
            color: var(--accent-color);
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            text-align: center;
            outline: none;
            width: 250px;
        }

        /* --- Botón de acceso --- */
        #enter-btn {
            display: block;
            margin: 18px auto 0;
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            letter-spacing: 3px;
            padding: 4px 22px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, text-shadow 0.2s;
        }

        #enter-btn:hover {
            border-color: #890808;
            color: #cc0000;
            text-shadow: 0 0 6px rgba(180, 0, 0, 0.6);
        }

        /* --- Leyenda pista con glitch --- */
        .hint-text {
            margin-top: 28px;
            font-size: 0.95rem;
            color: #8b0000;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
            animation: hint-pulse 3s ease-in-out infinite;
        }

        @keyframes hint-pulse {
            0%, 100% { opacity: 0.35; text-shadow: none; }
            50%        { opacity: 1;    text-shadow: 0 0 8px rgba(180, 0, 0, 0.7); }
        }

        /* Glitch: desplazamientos RGB y distorsión */
        .hint-text.glitching {
            animation: hint-glitch 0.5s steps(1) forwards;
        }

        @keyframes hint-glitch {
            0%   { 
                clip-path: inset(0 0 0 0);
                transform: translate(0);
                text-shadow: none;
                opacity: 1;
            }
            10%  { 
                clip-path: inset(20% 0 30% 0);
                transform: translate(-4px, 1px) skewX(-5deg);
                text-shadow: 3px 0 #ff0000, -3px 0 #00ffff;
                opacity: 0.9;
            }
            20%  { 
                clip-path: inset(60% 0 5% 0);
                transform: translate(4px, -1px) skewX(4deg);
                text-shadow: -4px 0 #ff0000, 4px 0 #00ffff;
                opacity: 0.7;
            }
            30%  { 
                clip-path: inset(10% 0 70% 0);
                transform: translate(-3px, 2px) skewX(-3deg);
                text-shadow: 2px 0 #ff0000, -2px 0 #00ffff;
                opacity: 0.5;
            }
            40%  { 
                clip-path: inset(40% 0 20% 0);
                transform: translate(5px, 0px) skewX(6deg);
                text-shadow: -5px 0 #ff0000, 5px 0 #00ffff;
                opacity: 0.3;
            }
            50%  { 
                clip-path: inset(0 0 0 0);
                transform: translate(0) scaleY(1.05);
                text-shadow: 3px 0 #ff0000, -3px 0 #00ffff;
                opacity: 0.1;
            }
            60%  {
                clip-path: inset(30% 0 40% 0);
                transform: translate(-2px, 1px) skewX(-4deg);
                text-shadow: -3px 0 #ff0000, 3px 0 #00ffff;
                opacity: 0.2;
            }
            70%  { 
                clip-path: inset(0 0 0 0);
                transform: translate(3px, -2px) skewX(3deg);
                text-shadow: 4px 0 #ff0000, -4px 0 #00ffff;
                opacity: 0.5;
            }
            80%  { 
                clip-path: inset(50% 0 10% 0);
                transform: translate(-2px, 0) skewX(-2deg);
                text-shadow: -2px 0 #ff0000, 2px 0 #00ffff;
                opacity: 0.7;
            }
            90%  { 
                clip-path: inset(0 0 0 0);
                transform: translate(1px, 1px);
                text-shadow: 1px 0 #ff0000, -1px 0 #00ffff;
                opacity: 0.9;
            }
            100% { 
                clip-path: inset(0 0 0 0);
                transform: translate(0);
                text-shadow: 0 0 8px rgba(180, 0, 0, 0.7);
                opacity: 1;
            }
        }

        /* --- Pantalla del Reproductor --- */
        #player-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            width: 90%;
            max-width: 500px;
        }

        .cassette-container {
            width: 300px;
            height: 190px;
            background: #1a1a1a;
            border-radius: 10px;
            position: relative;
            border: 4px solid #111; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .cassette-gif-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .cassette-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px; 
            opacity: 0.25; 
            z-index: 11;
            pointer-events: none; 
        }

        .label {
            position: absolute;
            top: 25px; 
            left: 80px; 
            width: 200px; 
            height: 50px;
            background: transparent; 
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 0;
            z-index: 12;
        }

        .track-info {
            font-size: 1.2rem;
            color: #000000; 
            overflow: hidden;
            white-space: nowrap;
            margin-top: 1px;
        }

        .side-info {
            color: #000000;
            font-size: 0.8rem;
            margin-top: -1px;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            font-family: 'VT323', monospace;
            padding: 5px 15px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        #lyrics-container {
            width: 100%;
            height: 240px; 
            overflow-y: auto;
            text-align: center;
            border-top: 1px solid #333;
            margin-top: 20px; 
            padding-top: 25px; 
            font-size: 1.1rem;
            color: #888;
            line-height: 1.4;
            white-space: pre-line;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; }

    </style>
</head>
<body>

        <button id="enter-btn" onclick="checkAccess()">[ ENTER ]</button>

<script>
