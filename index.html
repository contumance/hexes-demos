<head>
    <meta charset="UTF-8">

        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📼</text></svg>">

<body>

    <div class="noise"></div>

    <div id="login-screen">
        <div class="terminal-prompt">HEXES DEMOS: SECRET KEY</div>
        <input type="password" id="passkey" autocomplete="off" autofocus>
        <button id="enter-btn">[ ENTER ]</button>
        <div id="error-msg" class="error-msg">ACCESS DENIED</div>
        <br>
        <p class="hint-text" id="hint-text">FIND THE RED WORD ON THE CARD</p>
    </div>

    <div id="player-screen">
        <div class="cassette-container">
            <canvas id="visualizer" class="visualizer"></canvas>
            <img src="assets/cassette_static.png" alt="Cassette Animation" class="cassette-gif-bg" id="cassette-bg">
            <img src="assets/cassette_capa_intermedia.png" alt="Capa Intermedia" class="cassette-capa-intermedia"
                id="cassette-capa">
            <img src="assets/logo_hexes.png" alt="Hexes Logo" class="cassette-logo">

            <div class="label">
                <div class="track-info" id="current-title">HEXES_DEMO_01.RAW</div>
                <div class="side-info">SIDE A: UNRELEASED MATERIAL</div>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>

            <div class="controls">
                <button id="prev-btn">[ PREV ]</button>
                <button id="play-btn" class="play-btn">[ PLAY ]</button>
                <button id="next-btn">[ NEXT ]</button>
                <button id="share-btn" title="Compartir en Redes">[ SHARE ]</button>
            </div>

            <div class="volume-container">
                <span>VOL:</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>

        <div class="playlist-panel" id="playlist-panel">
            <!-- Playlist items will be injected here -->
        </div>

        <div id="lyrics-container">
            <div id="lyrics-text">Selecciona un tema para ver la transmisión de letra...</div>
        </div>

        <div class="social-links">
            <a href="https://www.instagram.com/hexescult" target="_blank" rel="noopener noreferrer">[ INSTAGRAM ]</a>
            <a href="https://www.youtube.com/@hexescult" target="_blank" rel="noopener noreferrer">[ YOUTUBE ]</a>
        </div>

        <div class="subscribe-container">
            <form id="subscribe-form" action="https://formspree.io/f/mqevkwdw" method="POST">
                <input type="email" name="email" placeholder="ENTER EMAIL TO JOIN THE CULT..." required>
                <button type="submit">[ JOIN ]</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
